[project]
authors = [{ name = "Marty Oehme", email = "contact@martyoeh.me" }]
license = { text = "GPL-3.0-or-later" }
requires-python = "<4.0,>=3.10"
dependencies = [
    "pymupdf<2.0.0,>=1.24.2",
    "levenshtein<1.0.0,>=0.25.1",
    "papis<1.0,>=0.15",
    "click<9.0.0,>=8.1.7",
    "python-magic<1.0.0,>=0.4.27",
    "chevron<1.0.0,>=0.14.0",
]
name = "papis-extract"
version = "0.3.0"
description = ""
readme = "README.md"
keywords = [
    "papis",
    "pdf",
    "biblatex",
    "bibtex",
    "bibliography",
    "reference manager",
    "research",
]

[project.urls]
homepage = "https://git.martyoeh.me/Marty/papis-extract"
repository = "https://github.com/marty-oehme/papis-extract"

[project.entry-points."papis.command"]
extract = "papis_extract:main"

[project.optional-dependencies]
whoosh = ["whoosh<3.0.0,>=2.7.4"]
pocketbook = ["beautifulsoup4<5.0.0,>=4.12.3"]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov>=7.1.0"]

[tool.ruff]
extend-exclude = ["tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "C4",  # Catch incorrect use of comprehensions, dict, list, etc
    "D",   # Pydocstyle rules for docstrings
    "F",   # Pyflakes rules
    "FA",  # Enforce from __future__ import annotations
    "I",   # Sort imports properly
    "ICN", # Use common import conventions
    "ISC", # Good use of string concatenation
    "NPY", # Some numpy-specific things
    "PTH", # Use pathlib instead of os.path
    "RET", # Good return practices
    "SIM", # Common simplification rules
    "TC",  # Enforce importing certain types in a TYPE_CHECKING block
    "TID", # Some good import practices
    "UP",  # Warn if certain things can changed due to newer Python versions
    "W",   # PyCodeStyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "strict"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
